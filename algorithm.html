<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Playground</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/classes.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
</head>

<body class="bg-dark text-light">
    <header class="nav container flex between center-y">
        <a class="logo" href="index.html">
            <img src="/images/logopng.png" alt="Algorithm Visual Lab logo">
        </a>

        <nav class="flex-center gap-md hide-sm">
            <a href="/algorithms.html" class="nav-link">Algorithms</a>
            <a href="/about.html" class="nav-link">About</a>
        </nav>

        <div class="flex-center gap-sm">
            <a href="/admin.html" class="btn ghost">Log in</a>
            <a href="/algorithms.html" class="btn primary">Start</a>
        </div>
    </header>

    <main class="container algorithm-detail">
        <a href="/algorithms.html" class="btn-ghost detail-back">Back to algorithms</a>

        <section id="algorithmHero" class="detail-hero"></section>

        <section class="detail-layout">
            <article class="detail-panel">
                <h2>How it works</h2>
                <div id="algorithmSteps" class="steps-list"></div>

                <h2>Complexity</h2>
                <div id="complexityGrid" class="complexity-grid"></div>
            </article>

            <section class="playground-panel">
                <div class="playground-toolbar">
                    <div>
                        <h2>Playground</h2>
                        <span id="playgroundLanguage" class="text-muted text-sm"></span>
                    </div>

                    <div class="flex gap-sm">
                        <button id="resetCode" class="btn-ghost" type="button">Reset</button>
                        <button id="runCode" class="btn primary" type="button">Run</button>
                    </div>
                </div>

                <textarea id="codeEditor" class="code-editor" spellcheck="false"></textarea>

                <div class="output-panel">
                    <div class="output-title">Output</div>
                    <pre id="codeOutput"></pre>
                </div>
            </section>
        </section>
    </main>

    <script type="module" src="/src/detail.js"></script>
</body>

</html>
